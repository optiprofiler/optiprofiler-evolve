# yaml-language-server: $schema=../config.schema.json

data:
  library: s2mpj
  problem_names: [BEALE, CUBE, HIMMELBB, JENSMP, ROSENBR]
  split:
    hidden_fraction: 0.2
    smoke_count: 1
    seed: 20260713

evaluation:
  backend: docker
  docker_image: optiprofiler-evolve-evaluator:latest
  cpus: 1
  memory: 2g
  pids_limit: 256
  feedback_mode: agent
  benchmark:
    max_eval_factor: 20
    n_jobs: 2
    score_only: true
  smoke_overrides:
    max_eval_factor: 5

evolution:
  iterations: 1
  islands: 1
  population_per_island: 2

workers:
  max_parallel: 1
  timeout_seconds: 900
  pool:
    - harness: codex
      model: ${OPTIPROFILER_EVOLVE_CODEX_MODEL}
      env:
        CODEX_PROVIDER_API_KEY: ${OPTIPROFILER_EVOLVE_API_KEY}
      args:
        - --config
        - 'model_provider="compatible"'
        - --config
        - 'model_providers.compatible.name="Compatible provider"'
        - --config
        - 'model_providers.compatible.base_url="${OPTIPROFILER_EVOLVE_OPENAI_BASE_URL}"'
        - --config
        - 'model_providers.compatible.env_key="CODEX_PROVIDER_API_KEY"'
        - --config
        - 'model_providers.compatible.wire_api="responses"'
  tools:
    preset: research
    # Enable only after the provider proves Responses web-search support.
    web_search: false
    network: true
    communication: none

integrity_review:
  component:
    name: agent_integrity
  allow_same_model: true  # Quick-start only; use a distinct reviewer model for studies.
  retries: 1

sandbox:
  backend: docker
  worker_image: optiprofiler-evolve-worker:latest
  cpus: 1
  memory: 2g
  pids_limit: 256
