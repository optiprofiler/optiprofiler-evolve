# Owner-trusted subscription smoke. This gives the worker access to your login.
# Install .[harbor], build all three runtime images, then run codex login on host.
data:
  library: s2mpj
  problem_names: [ROSENBR, BEALE, CUBE, HIMMELBB]
  selection: {ptype: u}
  split:
    public: [ROSENBR, BEALE]
    validation: [CUBE]
    hidden: [HIMMELBB]
    smoke: [BEALE]
    lockbox_required: true
evolution:
  iterations: 1
  islands: 2
  attempts_per_island: 1
  population_per_island: 2
  migration_interval: 0
workers:
  adapter: harbor
  allow_direct_provider: true
  max_parallel: 1
  timeout_seconds: 360
  token_budget: 30000
  pool:
    - harness: codex
      model: gpt-5.3-codex-spark
      env:
        CODEX_AUTH_JSON_PATH: ${HOME}/.codex/auth.json
  tools: {network: true, web_search: false, communication: island}
sandbox:
  backend: docker
  worker_image: optiprofiler-evolve-worker:latest
  allow_direct_network: true
  cpus: 1
  memory: 1g
execution:
  backend: docker
  docker_image: optiprofiler-evolve-evaluator:latest
  solver_image: optiprofiler-evolve-solver:latest
  cpus: 1
  memory: 1g
  timeout_seconds: 180
  feedback_mode: full_artifacts
assessment:
  criteria:
    performance:
      options:
        reference: scipy_powell
        benchmark: {max_eval_factor: 20, n_jobs: 1, score_only: false}
        smoke_overrides: {max_eval_factor: 10, n_jobs: 1}
    integrity:
      options:
        component: {name: agent_integrity}
        allow_same_model: true
        retries: 1
        timeout_seconds: 300
    complexity: {enabled: false, mode: warn}
workflow:
  phases:
    - name: prepare
    - name: explore
    - name: validate
    - name: hidden
    - name: report
      options: {require_explanation: true, repair_attempts: 1}
