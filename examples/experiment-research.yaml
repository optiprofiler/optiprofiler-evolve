data:
  library: s2mpj
  selection:
    ptype: u
    mindim: 1
    maxdim: 10
  split:
    validation_fraction: 0.2
    hidden_fraction: 0.2
    smoke_count: 3
    seed: 20260721
evolution:
  iterations: 10
  islands: 4
  attempts_per_island: 1
  population_per_island: 4
  migration_interval: 0
  finalists_per_island: 1
  random_seed: 20260721
workers:
  max_parallel: 4
  timeout_seconds: 1800
  token_budget: 80000
  pool:
  - harness: claude
    model: ${OPTIPROFILER_EVOLVE_MODEL}
    pass_env:
    - ANTHROPIC_API_KEY
    provider_gateway:
      upstream_base_url: https://api.anthropic.com
      credential_env: ANTHROPIC_API_KEY
      auth_mode: x-api-key
  tools:
    preset: research
    web_search: true
    network: true
    shell: true
    python: true
    git: true
    compilers: true
    package_install: false
    communication: island
sandbox:
  backend: docker
  worker_image: optiprofiler-evolve-worker:latest
  cpus: 2
  memory: 4g
  pids_limit: 512
workflow:
  phases:
  - name: prepare
  - name: direction_scout
    options:
      mode: shared
      guided_islands:
      - 0
      - 1
      max_directions: 4
      worker_index: 0
      token_budget: 30000
      prompt_version: direction-scout/1
      tools:
        network: true
        web_search: true
  - name: explore
  - name: strategy_analysis
    options:
      max_strategies: 6
      max_ablations: 6
      min_effect: 0.01
      n_repeats: 1
      evaluation_mode: smoke
      worker_index: 0
      token_budget: 30000
      prompt_version: strategy-analysis/1
      tools:
        network: true
        web_search: false
  - name: strategy_transfer
    options:
      max_strategies_per_island: 3
      attempts_per_island: 1
      worker_index: 0
      token_budget: 30000
      prompt_version: strategy-transfer/1
      tools:
        network: true
        web_search: false
  - name: validate
  - name: hidden
  - name: challenger
    options:
      reference: prima_newuoa
  - name: report
  attempt_steps:
  - name: mutate
  - name: static_audit
  - name: smoke
  - name: public_evaluate
  - name: feedback
  after_iteration: []
execution:
  backend: docker
  docker_image: optiprofiler-evolve-evaluator:latest
  cpus: 2
  memory: 4g
  pids_limit: 512
  feedback_mode: full_artifacts
  forbidden_candidate_imports:
  - prima
assessment:
  criteria:
    performance:
      options:
        reference: initial
        benchmark:
          max_eval_factor: 200
          n_jobs: 4
          score_only: false
        smoke_overrides:
          max_eval_factor: 10
          n_jobs: 2
    integrity:
      options:
        component:
          name: agent_integrity
        allow_same_model: true
        retries: 1
        timeout_seconds: 600
        token_budget: 12000
    complexity:
      enabled: false
      mode: warn
      options: {}
