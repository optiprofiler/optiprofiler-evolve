# yaml-language-server: $schema=https://raw.githubusercontent.com/optiprofiler/optiprofiler-evolve/f086cb398648a2946d2682493f9c299f701fa3bd/config.schema.json

data:
  library: s2mpj
  problem_names: [BEALE, CUBE, HIMMELBB, JENSMP, ROSENBR]
  split:
    hidden_fraction: 0.2
    smoke_count: 1
    seed: 20260713

evaluation:
  backend: docker
  docker_image: optiprofiler-evolve-evaluator:latest
  cpus: 1
  memory: 2g
  pids_limit: 256
  feedback_mode: agent
  benchmark:
    max_eval_factor: 20
    n_jobs: 2
  smoke_overrides:
    max_eval_factor: 5

evolution:
  iterations: 1
  islands: 1
  population_per_island: 2

workers:
  max_parallel: 1
  timeout_seconds: 900
  pool:
    - harness: claude
      model: ${OPTIPROFILER_EVOLVE_MODEL}
      pass_env: [ANTHROPIC_API_KEY]
      provider_gateway:
        upstream_base_url: https://api.anthropic.com
        credential_env: ANTHROPIC_API_KEY
        auth_mode: x-api-key
  tools:
    preset: research
    web_search: true
    network: true
    communication: none

integrity_review:
  component:
    name: agent_integrity
  allow_same_model: true
  retries: 1

sandbox:
  backend: docker
  worker_image: optiprofiler-evolve-worker:latest
  cpus: 1
  memory: 2g
  pids_limit: 256
