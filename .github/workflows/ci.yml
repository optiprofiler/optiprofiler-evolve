name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts examples
      - run: python scripts/check_markdown_links.py
      # Includes the collaborator's pytest-only architecture boundary checks.
      - run: python -m pytest tests -q
      - run: python -m build
      - run: python scripts/check_wheel.py "$(find dist -name '*.whl' -print -quit)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/worker/Dockerfile -t optiprofiler-evolve-worker:ci .
      - run: docker build -f docker/evaluator/Dockerfile -t optiprofiler-evolve-evaluator:ci .
      - run: docker build -f docker/solver/Dockerfile -t optiprofiler-evolve-solver:latest .
      - run: docker build -f docker/gateway/Dockerfile -t optiprofiler-evolve-gateway:ci .
      - run: docker run --rm --entrypoint python optiprofiler-evolve-evaluator:ci -m pip check
      - run: >-
          docker run --rm --entrypoint sh optiprofiler-evolve-worker:ci -lc
          'codex --version && claude --version && ddgr --version && python -c "import numpy, scipy"'
      - run: >-
          printf 'probe\n' | docker run --rm --interactive --entrypoint sh
          optiprofiler-evolve-worker:ci -c 'read value && test "$value" = probe'
      - run: >-
          docker run --rm --entrypoint python optiprofiler-evolve-evaluator:ci -c
          'import optiprofiler, optiprofiler_evolve, pdfo, prima, yaml;
          from optiprofiler_evolve.criteria.performance.competitors import competitor_names;
          assert {"pdfo_newuoa", "prima_newuoa"} <= set(competitor_names("u"))'
      - run: >-
          docker run --rm -v "$PWD/tests:/tests:ro" --entrypoint python
          optiprofiler-evolve-evaluator:ci -m unittest discover -s /tests -p test_competitors.py -v
      - run: docker run --rm optiprofiler-evolve-gateway:ci --help
      - run: python -m pip install -e .
      - run: >-
          OPE_RUN_DOCKER_TESTS=1
          OPE_GATEWAY_IMAGE=optiprofiler-evolve-gateway:ci
          OPE_EVALUATOR_IMAGE=optiprofiler-evolve-evaluator:ci
          python -m unittest tests.test_docker_integration -v

  harbor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[harbor]'
      - run: docker compose version
      - run: docker pull python:3.12-slim-bookworm
      - run: docker build -f docker/gateway/Dockerfile -t optiprofiler-evolve-gateway:harbor-ci .
      - run: >-
          OPE_RUN_HARBOR_TESTS=1
          OPE_GATEWAY_IMAGE=optiprofiler-evolve-gateway:harbor-ci
          python -m unittest discover -s tests -p test_harbor_worker.py -v
