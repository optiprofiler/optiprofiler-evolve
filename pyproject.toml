[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "optiprofiler-evolve"
version = "0.1.0a0"
description = "Benchmark-driven evolution of derivative-free optimization solvers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "OptiProfiler contributors"}]
keywords = [
    "derivative-free-optimization",
    "algorithm-evolution",
    "benchmarking",
    "optiprofiler",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "optiprofiler>=1.3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "jsonschema>=4.23",
    "pytest>=8",
    "ruff>=0.11",
]

[project.urls]
Homepage = "https://www.optprof.com"
Repository = "https://github.com/optiprofiler/optiprofiler-evolve"

[tool.setuptools.packages.find]
where = ["src"]
include = ["optiprofiler_evolve*"]
exclude = ["optiprofiler_evolve.tests*"]

[tool.setuptools.package-data]
optiprofiler_evolve = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
